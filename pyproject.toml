[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml741-assignment4"
version = "0.1.0"
description = "Self-organising maps for network traffic classification"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<4", "scikit-learn>=1.6,<2", "scipy>=1.14,<2", "matplotlib>=3.9,<4", "pyyaml>=6,<7", "joblib>=1.4,<2", "threadpoolctl>=3.5,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[project.scripts]
ml741-a4 = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "artifacts", "assessment_baselines", "assessment_models", "assessment_statistics",
    "bootstrap", "cli", "clustering", "config", "data", "experiments", "mapping",
    "preprocessing", "som", "splits", "verification"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["baselines*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
